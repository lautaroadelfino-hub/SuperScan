# Refresco semanal de los precios del catalogo desde el dataset SEPA de la
# Secretaria de Comercio (https://datos.produccion.gob.ar/dataset/sepa-precios,
# CC-BY-4.0). Baja el zip del dia, lo filtra a las sucursales de Tandil y
# actualiza Firestore. Todo el trabajo lo hace subida_firebase/refrescar_sepa.py:
# aca solo esta el reloj.
#
# ESTE REPO ES PUBLICO. Por eso:
#   - los unicos disparadores son schedule y workflow_dispatch (nunca
#     pull_request_target ni issue_comment: por ahi se lleva un fork el secret);
#   - el GITHUB_TOKEN va con permisos de solo lectura;
#   - las actions estan fijadas por SHA, no por tag (un tag se puede mover);
#   - el service account se escribe en disco y no se imprime nunca. Conviene que
#     sea uno dedicado, con el rol roles/datastore.user y nada mas, y no el
#     firebase-adminsdk que ademas puede firmar tokens y tocar Storage.
#   - los logs y los artifacts de un repo publico los ve cualquiera. Lo que se
#     sube (precios de SEPA) ya es publico; el service account, nunca.
#
# OJO: GitHub desactiva solo los workflows programados despues de 60 dias sin
# actividad en el repo, y avisa por mail. Se reactivan desde la pestaña Actions
# o con un disparo manual.

name: Precios SEPA

on:
  schedule:
    # Lunes 19:00 UTC = 16:00 en Argentina. El zip del lunes se publica cerca de
    # las 13:20 ART, asi que hay ~2,5 h de margen.
    - cron: "0 19 * * 1"
    # Segundo intento por si el portal se atraso. Con --si-hace-falta sale sin
    # hacer nada si el de las 16 ya dejo el catalogo al dia.
    - cron: "0 22 * * 1"
  workflow_dispatch:
    inputs:
      modo:
        description: "probar = solo conectividad | simular = no escribe nada | aplicar = escribe en Firestore"
        type: choice
        default: probar
        options: [probar, simular, aplicar]
      dia:
        description: "Dia de la semana a bajar (vacio = el de hoy)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: precios-sepa
  cancel-in-progress: false

jobs:
  refrescar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # En las corridas programadas no hay inputs: ahi el modo es aplicar.
      MODO: ${{ inputs.modo || 'aplicar' }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: subida_firebase/requirements.txt

      - name: Instalar dependencias
        run: pip install -r subida_firebase/requirements.txt

      # --- probar: solo mira si el portal nos deja bajar desde un runner ------
      - name: Probar el portal
        if: env.MODO == 'probar'
        working-directory: subida_firebase
        run: python bajar_sepa.py --probar ${{ inputs.dia && format('--dia {0}', inputs.dia) || '' }}

      # --- simular / aplicar --------------------------------------------------
      - name: Escribir credenciales
        if: env.MODO != 'probar'
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: |
          if [ -z "$FIREBASE_SA_JSON" ]; then
            echo "Falta el secret FIREBASE_SA_JSON (el service account en base64)." >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SA_JSON" | base64 -d > subida_firebase/credenciales.json
          chmod 600 subida_firebase/credenciales.json
          # Lo unico que se imprime del service account es el proyecto.
          python -c "import json; print('service account del proyecto', json.load(open('subida_firebase/credenciales.json'))['project_id'])"

      - name: Refrescar precios
        if: env.MODO != 'probar'
        working-directory: subida_firebase
        run: |
          set -o pipefail
          python refrescar_sepa.py \
            ${{ env.MODO == 'aplicar' && '--aplicar --si-hace-falta' || '' }} \
            ${{ inputs.dia && format('--dia {0}', inputs.dia) || '' }} \
            2>&1 | tee refresco.log

      - name: Resumen
        if: always() && env.MODO != 'probar'
        working-directory: subida_firebase
        run: |
          if [ -f refresco.log ]; then
            {
              echo '```'
              sed -n '/^RESUMEN$/,$p' refresco.log | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar la descarga filtrada
        if: always() && env.MODO != 'probar'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: sepa-${{ github.run_id }}
          # Datos de SEPA (publicos) y la cola de altas. NUNCA credenciales.json.
          path: |
            subida_firebase/Datos*/**
            subida_firebase/altas_pendientes.json
            subida_firebase/refresco.log
          retention-days: 90
          if-no-files-found: warn

      - name: Borrar credenciales
        if: always()
        run: rm -f subida_firebase/credenciales.json
