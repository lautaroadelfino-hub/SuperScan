# Límite de RAM acotado para que el daemon de Gradle no agote la memoria del
# sistema (esta máquina ya sufrió un OOM del JVM durante un build).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Compilación secuencial: en equipos con poca RAM el modo paralelo multiplica
# el consumo de memoria y puede terminar en OOM.
org.gradle.parallel=false
org.gradle.workers.max=2

# Caché de build
org.gradle.caching=true

# Caché de configuración: Gradle guarda el resultado de leer y evaluar los
# build.gradle.kts y lo reusa mientras no cambien. Ataca el tiempo fijo que se
# paga en CADA build, que en esta máquina es la mayor parte de una recompilación
# chica. No aumenta el consumo de memoria: no toca -Xmx ni el paralelismo.
# Si algún plugin diera problemas, se saca esta línea y listo.
org.gradle.configuration-cache=true

kotlin.code.style=official
android.nonTransitiveRClass=true
